<text x="40" y="600" class="b" text-anchor="start">Notes</text>
<text x="40" y="620" class="s" text-anchor="start">• Chaque pédale relie son GPIO à la masse ; la résistance de rappel est interne (INPUT_PULLUP). Contact normalement ouvert : appui = niveau bas.</text>
<text x="40" y="640" class="s" text-anchor="start">• Une LED rouge à 330 Ω sous 3,3 V consomme environ 4 mA ; 7 LED = environ 30 mA, sans problème pour l'USB.</text>
<text x="40" y="660" class="s" text-anchor="start">• Évités volontairement : GPIO 0, 2, 5, 12, 15 (démarrage ; le 5 porte la LED de la carte), 34 à 39 (entrées seules, sans rappel ; le 35 lit la batterie), 1 et 3 (liaison USB).</text>
<text x="40" y="680" class="s" text-anchor="start">• Option câble long ou pédales loin du boîtier : 220 Ω en série et 10 nF vers la masse sur chaque entrée, au plus près de la carte.</text>
<text x="40" y="700" class="s" text-anchor="start">• Numéros de GPIO à vérifier sur la sérigraphie de la carte (le brochage varie selon la version).</text>
</svg>