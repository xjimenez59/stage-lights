<text x="40" y="690" class="b" text-anchor="start">Notes</text>
<text x="40" y="710" class="s" text-anchor="start">• Les pédales sont de simples contacts fugitifs (normalement ouverts) entre l'entrée Dn et la masse : la résistance de rappel est interne (INPUT_PULLUP).</text>
<text x="40" y="730" class="s" text-anchor="start">• Sorties du 74HC595 sur 3,3 V : une LED rouge à 330 Ω consomme environ 4 mA ; 7 LED = environ 30 mA, sans problème pour l'USB.</text>
<text x="40" y="750" class="s" text-anchor="start">• Option câble long ou pédales loin du boîtier : 220 Ω en série et 10 nF vers la masse sur chaque entrée, au plus près de la carte.</text>
<text x="40" y="770" class="s" text-anchor="start">• À vérifier sur le matériel : D6 est la sortie série de démarrage (GPIO43), D2 est une broche de configuration (GPIO3) ; ne pas y mettre de rappel externe fort.</text>
</svg>
